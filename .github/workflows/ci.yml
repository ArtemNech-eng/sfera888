# CI для монорепы sfera888.
#
# Что проверяем на каждом PR и на push в main:
#   1. Типы — корневой `pnpm typecheck` (это `tsc --build` для lib/* плюс
#      typecheck по всем артефактам, у которых скрипт есть).
#   2. Тесты api-server — `tsx --test ./__tests__/**/*.test.ts`.
#   3. Сборку — корневой `pnpm build`, тот же набор артефактов, что
#      собирается на Railway.
#
# Сборка вынесена в отдельный job, чтобы падение тяжёлого билда не скрывало
# результат быстрых проверок типов и тестов (и наоборот).

name: CI

on:
  pull_request:
  push:
    branches: [main]

# Новый пуш в ту же ветку отменяет предыдущий прогон — не жжём минуты.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # puppeteer-core + @sparticuz/chromium-min: браузер в CI не нужен.
  PUPPETEER_SKIP_DOWNLOAD: "true"
  CI: "true"
  # Важно: не берём версию из engines.node (">=22.12.0") — setup-node
  # разрешает такой диапазон в самый свежий мажор (Node 25), а проект
  # живёт на 22 и в artifacts/crm/.npmrc стоит engine-strict=true.
  NODE_VERSION: "22.x"

jobs:
  typecheck-test:
    name: Типы и тесты
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # Версию pnpm берёт из "packageManager" в package.json (pnpm@10.33.2).
      - uses: pnpm/action-setup@v4

      # setup-node ставится после pnpm, иначе cache: pnpm не найдёт менеджер.
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # Диагностика: фиксируем фактические версии в логе — без этого
      # падение на несовпадении движка выглядит немотивированным.
      - name: Версии окружения
        run: |
          node --version
          pnpm --version

      # Сначала строгая установка. Если манифест менялся без локального
      # pnpm install, лок-файл отстаёт — повторяем без --frozen-lockfile,
      # но с видимым предупреждением, чтобы рассинхрон не прошёл тихо.
      - name: Установка зависимостей
        run: |
          pnpm install --frozen-lockfile --reporter=append-only || {
            echo "::warning::pnpm-lock.yaml рассинхронизирован с package.json. Повторяю без --frozen-lockfile. Запустите локально pnpm install и закоммитьте лок-файл."
            pnpm install --no-frozen-lockfile --reporter=append-only
          }

      - name: Проверка типов
        run: pnpm run typecheck

      - name: Тесты api-server
        run: pnpm --filter @workspace/api-server run test

  build:
    name: Сборка артефактов
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Версии окружения
        run: |
          node --version
          pnpm --version

      - name: Установка зависимостей
        run: |
          pnpm install --frozen-lockfile --reporter=append-only || {
            echo "::warning::pnpm-lock.yaml рассинхронизирован с package.json. Повторяю без --frozen-lockfile. Запустите локально pnpm install и закоммитьте лок-файл."
            pnpm install --no-frozen-lockfile --reporter=append-only
          }

      - name: Сборка
        run: pnpm run build
