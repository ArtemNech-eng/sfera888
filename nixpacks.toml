# Настройки сборки для Railway (nixpacks).
#
# Зачем этот файл.
# По умолчанию nixpacks ставит зависимости командой pnpm i --frozen-lockfile.
# Она падает с ERR_PNPM_OUTDATED_LOCKFILE при любом расхождении pnpm-lock.yaml
# с любым package.json в воркспейсе — ещё до этапа сборки. В этом репозитории
# правки нередко делаются без локального pnpm install, поэтому локфайл
# регулярно отстаёт, и деплой падает на ровном месте.
#
# Отдельная проблема: проверки в GitHub Actions при этом зелёные, потому что
# там установка откатывается на --no-frozen-lockfile. Получалось, что зелёный
# CI ничего не говорил о работоспособности деплоя.
#
# Здесь установка на Railway приводится к тому же поведению, что и в CI.
# Это осознанный компромисс: воспроизводимость версий слабее, зато деплой не
# падает из-за устаревшего локфайла. Правильное решение — обновить
# pnpm-lock.yaml локальным pnpm install, закоммитить его и вернуть сюда
# --frozen-lockfile.

[phases.install]
cmds = [
  "npm install -g corepack@0.24.1 && corepack enable",
  "pnpm install --no-frozen-lockfile",
]
