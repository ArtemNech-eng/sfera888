<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7C3AED"/>
      <stop offset="100%" style="stop-color:#4338CA"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.15)"/>
      <stop offset="100%" style="stop-color:rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect width="512" height="280" rx="116" fill="url(#shine)"/>

  <!-- Hard hat dome -->
  <path d="M 148 268 Q 148 148 256 148 Q 364 148 364 268 L 364 272 L 148 272 Z"
        fill="white" opacity="0.96"/>

  <!-- Hard hat brim -->
  <rect x="86" y="272" width="340" height="38" rx="19" fill="white" opacity="0.96"/>

  <!-- Center ridge detail on helmet -->
  <rect x="244" y="148" width="24" height="50" rx="12" fill="rgba(124,58,237,0.22)"/>

  <!-- Person body below (simple silhouette) -->
  <rect x="214" y="326" width="84" height="64" rx="20" fill="white" opacity="0.75"/>
  <!-- Person head circle -->
  <circle cx="256" cy="358" r="0" fill="white" opacity="0"/>

  <!-- Shoulders arc -->
  <path d="M 148 420 Q 148 360 256 360 Q 364 360 364 420 L 364 424 L 148 424 Z"
        fill="white" opacity="0.72"/>
</svg>
