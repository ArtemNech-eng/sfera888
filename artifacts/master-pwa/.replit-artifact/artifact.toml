kind = "web"
previewPath = "/master-pwa/"
title = "Мастер — приложение"
version = "1.0.0"
id = "artifacts/master-pwa"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
localPort = 21121
name = "web"
paths = ["/master-pwa/"]

[services.development]
run = "pnpm --filter @workspace/master-pwa run dev"

[services.env]
PORT = "21121"
BASE_PATH = "/master-pwa/"

[services.production]
build = ["pnpm", "--filter", "@workspace/master-pwa", "run", "build"]
publicDir = "artifacts/master-pwa/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"
