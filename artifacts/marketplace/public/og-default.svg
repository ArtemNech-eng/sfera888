<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Честные мастера">
  <!-- Background -->
  <rect width="1200" height="630" fill="#F8FAFC"/>

  <!-- Top + bottom accent strips -->
  <rect x="0" y="0"   width="1200" height="14" fill="#0F766E"/>
  <rect x="0" y="616" width="1200" height="14" fill="#0F766E"/>

  <!-- Subtle decorative card outline (right side), visual rhythm -->
  <rect x="780" y="120" width="340" height="380" rx="24"
        fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <rect x="812" y="160" width="120" height="14" rx="6" fill="#0F766E"/>
  <rect x="812" y="200" width="220" height="10" rx="4" fill="#E2E8F0"/>
  <rect x="812" y="222" width="180" height="10" rx="4" fill="#E2E8F0"/>
  <rect x="812" y="244" width="240" height="10" rx="4" fill="#E2E8F0"/>
  <rect x="812" y="284" width="160" height="38" rx="10" fill="#0F766E"/>

  <!-- Brand mark (rounded square + chevron + check) -->
  <g transform="translate(80, 200)">
    <rect width="120" height="120" rx="24" fill="#0F766E"/>
    <path d="M30 60 L60 30 L90 60"
          stroke="#FFFFFF" stroke-width="9"
          stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M40 75 L55 90 L80 60"
          stroke="#FFFFFF" stroke-width="9"
          stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Wordmark + tagline. system-ui fallback chain so the OG renderer
       picks the closest available sans-serif. -->
  <g font-family="Manrope, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
    <text x="240" y="285" font-size="84" font-weight="700" fill="#0F172A">
      Честные мастера
    </text>
    <text x="240" y="345" font-size="36" font-weight="500" fill="#64748B">
      Проверенные мастера для ремонта
    </text>
    <text x="240" y="405" font-size="22" font-weight="500" fill="#0F766E">
      chestnye-mastera.ru
    </text>
  </g>
</svg>
